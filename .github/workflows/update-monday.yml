name: Sync Monday.com tasks

on:
  schedule:
    - cron: '*/15 * * * *'   # toutes les 15 minutes
  workflow_dispatch:           # déclenchement manuel

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Monday.com tasks and push to Supabase
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, urllib.error
          from datetime import datetime, timezone

          token = os.environ.get('MONDAY_API_TOKEN', '')
          supabase_url = os.environ.get('SUPABASE_URL', '')
          supabase_key = os.environ.get('SUPABASE_SERVICE_KEY', '')

          if not token:
              print('⚠ MONDAY_API_TOKEN non défini — skip')
              exit(0)
          if not supabase_url or not supabase_key:
              print('⚠ SUPABASE_URL ou SUPABASE_SERVICE_KEY non défini — skip')
              exit(0)

          query = """
          {
            me {
              id
              name
            }
            boards(limit: 20, order_by: used_at) {
              id
              name
              state
              items_page(limit: 100) {
                items {
                  id
                  name
                  state
                  created_at
                  updated_at
                  url
                  board { id name }
                  group { id title }
                  column_values {
                    id
                    text
                    value
                    type
                  }
                  subitems {
                    id
                    name
                    state
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({"query": query}).encode()
          req = urllib.request.Request(
              'https://api.monday.com/v2',
              data=payload,
              headers={
                  'Content-Type': 'application/json',
                  'Authorization': token,
                  'API-Version': '2024-01',
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = json.loads(resp.read())
          except urllib.error.URLError as e:
              print(f'❌ Erreur réseau Monday: {e}')
              exit(1)

          if 'errors' in data:
              print(f'❌ Erreur API Monday: {data["errors"]}')
              exit(1)

          me_id = str(data['data']['me']['id'])
          me_name = data['data']['me']['name']
          print(f'✅ Connecté en tant que : {me_name} (id={me_id})')

          boards = data['data'].get('boards', [])
          tasks = []

          STATUS_COLORS = {
              'done':                 'done',
              'completed':            'done',
              'finished':             'done',
              'working on it':        'in_progress',
              'in progress':          'in_progress',
              'stuck':                'stuck',
              'fait':                 'done',
              'terminé':              'done',
              'terminée':             'done',
              'livré':                'done',
              'livrée':               'done',
              'en cours':             'in_progress',
              'en cours de livraison':'in_progress',
              'bloqué':               'stuck',
              'bloquée':              'stuck',
              'pas encore entamé':    'none',
              'à faire':              'none',
              'projet':               'none',
              'new':                  'none',
              '':                     'none',
          }

          for board in boards:
              if board.get('state') == 'deleted':
                  continue
              board_name = board['name']
              items = board.get('items_page', {}).get('items', [])
              for item in items:
                  if item.get('state') == 'deleted':
                      continue

                  assigned_to_me = False
                  status_text = ''
                  priority_text = ''
                  deadline = ''
                  timeline_end = ''

                  for col in item.get('column_values', []):
                      col_id   = col.get('id', '').lower()
                      col_type = col.get('type', '').lower()
                      col_text = col.get('text', '') or ''
                      col_val  = col.get('value', '') or ''

                      if col_type == 'people' or col_id in ('person', 'people', 'owner', 'assigned') or col_id.startswith('multiple_person') or col_id.startswith('person'):
                          if me_id in str(col_val):
                              assigned_to_me = True

                      if col_type == 'status' or col_id in ('status', 'statut', 'etat', 'état'):
                          status_text = col_text

                      if col_id in ('priority', 'priorite', 'priorité', 'prio'):
                          priority_text = col_text

                      if col_type == 'date' or col_id in ('date', 'deadline', 'due_date', 'echeance', 'échéance'):
                          if col_text:
                              deadline = col_text

                      if col_type == 'timerange' or col_id in ('timeline', 'planning'):
                          try:
                              v = json.loads(col_val)
                              timeline_end = v.get('to', '')
                          except Exception:
                              pass

                  if not assigned_to_me:
                      continue

                  status_norm = STATUS_COLORS.get(status_text.lower(), 'none')

                  tasks.append({
                      'id':           item['id'],
                      'name':         item['name'],
                      'board_id':     board['id'],
                      'board_name':   board_name,
                      'group':        item.get('group', {}).get('title', ''),
                      'status':       status_text,
                      'status_norm':  status_norm,
                      'priority':     priority_text,
                      'deadline':     deadline or timeline_end,
                      'url':          item.get('url', ''),
                      'updated_at':   item.get('updated_at', ''),
                      'created_at':   item.get('created_at', ''),
                      'subitems_count': len(item.get('subitems', [])),
                  })

          order = {'stuck': 0, 'in_progress': 1, 'none': 2, 'done': 3}
          tasks.sort(key=lambda t: (order.get(t['status_norm'], 2), t['deadline'] or 'zzz'))

          output = {
              'ok': True,
              'count': len(tasks),
              'updatedAt': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'source': 'github-action-monday',
              'tasks': tasks,
          }

          # Upsert vers Supabase (id=1 fixe)
          row = json.dumps({'id': 1, 'data': output, 'updated_at': output['updatedAt']}).encode()
          sb_req = urllib.request.Request(
              supabase_url.rstrip('/') + '/rest/v1/monday_tasks',
              data=row,
              headers={
                  'apikey':        supabase_key,
                  'Authorization': 'Bearer ' + supabase_key,
                  'Content-Type':  'application/json',
                  'Prefer':        'resolution=merge-duplicates',
              },
              method='POST'
          )
          try:
              with urllib.request.urlopen(sb_req, timeout=15) as sb_resp:
                  print(f'✅ Supabase upsert HTTP {sb_resp.status}')
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f'❌ Supabase upsert error {e.code}: {body}')
              exit(1)

          print(f'📋 monday_tasks : {len(tasks)} tâches stockées (privé)')
          PYEOF
        env:
          MONDAY_API_TOKEN:      ${{ secrets.MONDAY_API_TOKEN }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
