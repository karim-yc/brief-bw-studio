<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendrier — Studio Créatif</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --indigo:#4F46E5;--indigo-dark:#3730A3;--indigo-light:#818CF8;
  --indigo-bg:#EEF2FF;--indigo-border:#C7D2FE;
  --black:#1E1B4B;--white:#fff;
  --bg:#F8F7FF;--surface:#fff;
  --border:#E5E7EB;
  --text:#111827;--text-secondary:#6B7280;--text-tertiary:#9CA3AF;
  --urgent:#DC2626;--urgent-bg:#FEF2F2;
  --prio:#EA580C;--prio-bg:#FFF7ED;
  --success:#059669;--success-bg:#ECFDF5;
  --r:14px;--r-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.06);
}
html{background:linear-gradient(135deg,#4338CA 0%,#6366F1 50%,#818CF8 100%);background-attachment:fixed;min-height:100%}
body{font-family:'Inter',sans-serif;background:transparent;color:var(--text);min-height:100vh;font-size:14px;line-height:1.5}

/* ── App shell ── */
.app-shell{display:flex;min-height:100vh}

/* ── Sidebar ── */
.sidebar{width:220px;flex-shrink:0;background:rgba(30,27,75,.92);backdrop-filter:blur(16px);display:flex;flex-direction:column;padding:20px 12px;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-logo-wrap{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.sidebar-logo-icon{width:36px;height:36px;background:var(--indigo);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Anton',sans-serif;font-size:13px;color:#fff;letter-spacing:1px;flex-shrink:0}
.sidebar-logo-name{font-size:13px;font-weight:700;color:#fff;line-height:1.2}
.sidebar-logo-sub{font-size:10px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.6px}
.sidebar-nav{display:flex;flex-direction:column;gap:2px}
.snav-sep{height:1px;background:rgba(255,255,255,.1);margin:8px 4px}
.snav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:rgba(255,255,255,.6);font-size:13px;font-weight:500;text-decoration:none;transition:all .15s;cursor:pointer}
.snav-item:hover{background:rgba(255,255,255,.1);color:#fff}
.snav-item.active{background:var(--indigo);color:#fff}
.snav-item i{font-size:16px;flex-shrink:0}
.snav-item:not([href]):not(.active){opacity:.35;cursor:default}
.snav-item:not([href]):not(.active):hover{background:transparent;color:rgba(255,255,255,.6)}

/* ── Content ── */
.app-content{flex:1;min-width:0;display:flex;flex-direction:column}

/* ── Header ── */
.hdr{background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.5);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:50}
.hdr-brand{display:flex;align-items:center;gap:12px}
.hdr-title{font-size:15px;font-weight:700;color:var(--text)}
.hdr-sub{font-size:12px;color:var(--text-secondary)}
.hdr-actions{display:flex;align-items:center;gap:8px}
.hdr-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-sm);color:var(--text-secondary);font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;text-decoration:none;transition:all .15s;white-space:nowrap}
.hdr-btn:hover{border-color:var(--indigo);color:var(--indigo);background:#fff}
.hdr-btn-primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
.hdr-btn-primary:hover{background:var(--indigo-dark);border-color:var(--indigo-dark);color:#fff}

/* ── Main ── */
.cal-main{flex:1;padding:24px;display:flex;flex-direction:column;gap:20px}

/* ── Controls bar ── */
.cal-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav-btn{background:rgba(255,255,255,.85);border:1.5px solid rgba(255,255,255,.5);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);font-size:14px;transition:all .15s;backdrop-filter:blur(8px)}
.cal-nav-btn:hover{background:#fff;border-color:var(--indigo);color:var(--indigo)}
.cal-month-label{font-size:17px;font-weight:700;color:#fff;min-width:160px;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.2)}
.cal-today-btn{padding:6px 14px;background:rgba(255,255,255,.85);border:1.5px solid rgba(255,255,255,.5);border-radius:8px;font-size:12px;font-weight:600;color:var(--text);cursor:pointer;backdrop-filter:blur(8px);transition:all .15s;font-family:'Inter',sans-serif}
.cal-today-btn:hover{background:#fff;border-color:var(--indigo);color:var(--indigo)}

/* ── Legend ── */
.cal-legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,.75)}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* ── Calendar grid ── */
.cal-card{background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.12)}
.cal-grid-head{display:grid;grid-template-columns:repeat(7,1fr);background:var(--indigo-bg);border-bottom:1.5px solid var(--indigo-border)}
.cal-day-name{padding:10px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--indigo);text-transform:uppercase;letter-spacing:.5px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:100px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px;display:flex;flex-direction:column;gap:3px;transition:background .1s}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell:hover{background:#fafafa}
.cal-cell.other-month{background:#fafcff}
.cal-cell.other-month .cal-day-num{color:var(--text-tertiary)}
.cal-cell.today .cal-day-num{background:var(--indigo);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.cal-cell.today{background:var(--indigo-bg)}
.cal-day-num{font-size:12px;font-weight:600;color:var(--text);width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cal-events{display:flex;flex-direction:column;gap:2px;overflow:hidden}

/* ── Event chips ── */
.cal-event{padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;line-height:1.4;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .1s}
.cal-event:hover{opacity:.8}
.cal-event.lancement{background:#EEF2FF;color:#4338CA;border-left:2px solid #4F46E5}
.cal-event.validation{background:#FEF3C7;color:#92400E;border-left:2px solid #F59E0B}
.cal-event.retour{background:#F0FDF4;color:#166534;border-left:2px solid #22C55E}
.cal-event.urgent{background:var(--urgent-bg);color:var(--urgent);border-left:2px solid var(--urgent)}
.cal-event.prioritaire{background:var(--prio-bg);color:var(--prio);border-left:2px solid var(--prio)}
.cal-more{font-size:9px;color:var(--text-tertiary);font-weight:600;padding:1px 4px;cursor:pointer}
.cal-more:hover{color:var(--indigo)}

/* ── Detail panel ── */
.detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.detail-overlay.open{opacity:1;pointer-events:auto}
.detail-panel{background:#fff;border-radius:16px;width:100%;max-width:440px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);transform:translateY(10px);transition:transform .2s}
.detail-overlay.open .detail-panel{transform:translateY(0)}
.detail-head{padding:20px 20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.detail-title{font-size:14px;font-weight:700;color:var(--text)}
.detail-sub{font-size:11px;color:var(--text-secondary);margin-top:3px}
.detail-close{background:none;border:none;cursor:pointer;color:var(--text-secondary);font-size:18px;line-height:1;flex-shrink:0;padding:2px}
.detail-close:hover{color:var(--text)}
.detail-body{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.detail-row{display:flex;gap:10px;align-items:flex-start}
.detail-icon{width:28px;height:28px;border-radius:7px;background:var(--indigo-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.detail-icon i{font-size:14px;color:var(--indigo)}
.detail-info{flex:1}
.detail-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-tertiary);margin-bottom:2px}
.detail-val{font-size:13px;color:var(--text);font-weight:500}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:50px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.badge-urgent{background:var(--urgent-bg);color:var(--urgent)}
.badge-prioritaire{background:var(--prio-bg);color:var(--prio)}
.badge-normal{background:#F3F4F6;color:#6B7280}

/* ── Empty state ── */
.cal-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:48px 24px;color:rgba(255,255,255,.7);text-align:center}
.cal-empty i{font-size:40px;opacity:.4}
.cal-empty p{font-size:14px;font-weight:500}
.cal-empty small{font-size:12px;opacity:.7}

/* ── Stats strip ── */
.stats-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.stat-card{background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-radius:12px;padding:14px 16px;text-align:center}
.stat-num{font-size:22px;font-weight:700;color:var(--indigo);line-height:1}
.stat-label{font-size:11px;color:var(--text-secondary);margin-top:4px}

@media(max-width:680px){
  .sidebar{display:none}
  .cal-cell{min-height:60px}
  .stats-strip{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="app-shell">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-logo-wrap">
      <div class="sidebar-logo-icon">BW</div>
      <div>
        <div class="sidebar-logo-name">Studio Créatif</div>
        <div class="sidebar-logo-sub">Multi-marques</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a class="snav-item" href="../dashboard.html"><i class="ti ti-layout-dashboard"></i><span>Tableau de bord</span></a>
      <a class="snav-item" href="index.html"><i class="ti ti-plus-circle"></i><span>Nouvelle demande</span></a>
      <div class="snav-sep"></div>
      <a class="snav-item" href="../dashboard.html"><i class="ti ti-list"></i><span>Demandes</span></a>
      <a class="snav-item active" href="calendrier.html"><i class="ti ti-calendar-month"></i><span>Calendrier</span></a>

  </div>

  <div class="app-content">

    <!-- Header -->
    <header class="hdr">
      <div class="hdr-brand">
        <span class="hdr-title">Calendrier</span>
        <span class="hdr-sub">Dates de lancement et deadlines</span>
      </div>
      <nav class="hdr-actions">
        <a href="../dashboard.html" class="hdr-btn">
          <i class="ti ti-layout-dashboard"></i> Dashboard
        </a>
        <a href="index.html" class="hdr-btn hdr-btn-primary">
          <i class="ti ti-plus"></i> Nouvelle demande
        </a>
      </nav>
    </header>

    <main class="cal-main">

      <!-- Stats strip -->
      <div class="stats-strip" id="stats-strip">
        <div class="stat-card"><div class="stat-num" id="stat-total">—</div><div class="stat-label">Briefs ce mois</div></div>
        <div class="stat-card"><div class="stat-num" id="stat-urgent" style="color:#DC2626">—</div><div class="stat-label">Urgents</div></div>
        <div class="stat-card"><div class="stat-num" id="stat-prio" style="color:#EA580C">—</div><div class="stat-label">Prioritaires</div></div>
        <div class="stat-card"><div class="stat-num" id="stat-upcoming">—</div><div class="stat-label">Dans les 7 jours</div></div>

      <!-- Controls -->
      <div class="cal-controls">
        <div class="cal-nav">
          <button class="cal-nav-btn" id="btn-prev" aria-label="Mois précédent"><i class="ti ti-chevron-left"></i></button>
          <span class="cal-month-label" id="month-label"></span>
          <button class="cal-nav-btn" id="btn-next" aria-label="Mois suivant"><i class="ti ti-chevron-right"></i></button>

      <!-- Calendar -->
      <div class="cal-card">

          <div class="cal-day-name">Lun</div>

          <div class="cal-day-name">Jeu</div>
          <div class="cal-day-name">Ven</div>
          <div class="cal-day-name">Sam</div>

        <div class="cal-grid" id="cal-grid"></div>

    </main>

</div>

<!-- Detail panel -->
<div class="detail-overlay" id="detail-overlay" role="dialog" aria-modal="true" aria-label="Détail du brief">
  <div class="detail-panel">
    <div class="detail-head">
      <div>
        <div class="detail-title" id="d-title"></div>
        <div class="detail-sub" id="d-sub"></div>
      </div>
      <button class="detail-close" id="detail-close" aria-label="Fermer">×</button>

<script>
const STORAGE_KEY = 'bw_brief_v2_draft';
const HISTORY_KEY = 'bw_brief_history';

/* ── Chargement des briefs ── */
async function loadBriefs() {
  const all = [];

  // 1. API
  try {
    const r = await fetch('../api/briefs.json');
    const data = await r.json();
    if (data.ok && data.briefs) all.push(...data.briefs);
  } catch {}

  // 2. Historique localStorage
  try {
    const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
    hist.forEach(b => { if (!all.find(x => x.id === b.id)) all.push(b); });
  } catch {}

  return all;
}

/* ── Extraction des événements depuis un brief ── */
function briefToEvents(brief) {
  const events = [];
  const data = brief.data || brief;
  const label = data.ref || data.nomProduit || brief.id || 'Brief';
  const marque = data.marque || '';
  const prio = data.priorite || data.prioriteNiveau || 'normal';
  const type = data.typeDemande || '';

  const add = (dateStr, kind, kindLabel) => {
    if (!dateStr) return;
    const d = new Date(dateStr);
    if (isNaN(d)) return;
    events.push({ date: d, label, marque, prio, type, kind, kindLabel, brief });
  };

  add(data.dateLancement,     'lancement',   'Lancement');
  add(data.dateValidation,    'validation',  'Infos validées');
  add(data.dateRetourSimul,   'retour',      'Aperçu visuel');
  // Brief rapide
  add(data.launch || data['r-launch'], 'lancement', 'Lancement');

  return events;
}

/* ── Rendu calendrier ── */
let currentYear, currentMonth, allEvents = [];

function renderCalendar(year, month) {
  currentYear = year;
  currentMonth = month;

  const months = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  document.getElementById('month-label').textContent = `${months[month]} ${year}`;

  const today = new Date();
  const firstDay = new Date(year, month, 1);
  const lastDay  = new Date(year, month + 1, 0);

  // Semaine commence lundi : (0=dim → 6, 1=lun → 0, …)
  let startDow = firstDay.getDay();
  startDow = (startDow === 0) ? 6 : startDow - 1;

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  // Jours du mois précédent
  const prevLast = new Date(year, month, 0).getDate();
  for (let i = startDow - 1; i >= 0; i--) {
    grid.appendChild(makeCell(new Date(year, month - 1, prevLast - i), true));
  }
  // Jours du mois
  for (let d = 1; d <= lastDay.getDate(); d++) {
    grid.appendChild(makeCell(new Date(year, month, d), false));
  }
  // Compléter la grille (multiples de 7)
  const total = startDow + lastDay.getDate();
  const rem = (7 - (total % 7)) % 7;
  for (let d = 1; d <= rem; d++) {
    grid.appendChild(makeCell(new Date(year, month + 1, d), true));
  }

  updateStats(year, month);
}

function makeCell(date, otherMonth) {
  const cell = document.createElement('div');
  cell.className = 'cal-cell' + (otherMonth ? ' other-month' : '');

  const today = new Date();
  if (!otherMonth &&
      date.getDate() === today.getDate() &&
      date.getMonth() === today.getMonth() &&
      date.getFullYear() === today.getFullYear()) {
    cell.classList.add('today');
  }

  const num = document.createElement('div');
  num.className = 'cal-day-num';
  num.textContent = date.getDate();
  cell.appendChild(num);

  const evts = document.createElement('div');
  evts.className = 'cal-events';

  const dayEvts = allEvents.filter(e =>
    e.date.getFullYear() === date.getFullYear() &&
    e.date.getMonth()    === date.getMonth() &&
    e.date.getDate()     === date.getDate()
  );

  const MAX_SHOW = 3;
  dayEvts.slice(0, MAX_SHOW).forEach(ev => {
    const chip = document.createElement('div');
    const cls = ev.prio === 'urgent' ? 'urgent' :
                ev.prio === 'prioritaire' ? 'prioritaire' : ev.kind;
    chip.className = `cal-event ${cls}`;
    chip.textContent = ev.label;
    chip.title = `${ev.kindLabel} — ${ev.label}`;
    chip.addEventListener('click', () => openDetail(ev));
    evts.appendChild(chip);
  });

  if (dayEvts.length > MAX_SHOW) {
    const more = document.createElement('div');
    more.className = 'cal-more';
    more.textContent = `+${dayEvts.length - MAX_SHOW} autre${dayEvts.length - MAX_SHOW > 1 ? 's' : ''}`;
    more.addEventListener('click', () => openDetail(dayEvts[MAX_SHOW]));
    evts.appendChild(more);
  }

  cell.appendChild(evts);
  return cell;
}

/* ── Stats ── */
function updateStats(year, month) {
  const monthEvts = allEvents.filter(e => e.date.getFullYear() === year && e.date.getMonth() === month);
  const monthBriefs = new Set(monthEvts.map(e => e.brief.id || JSON.stringify(e.brief))).size;

  const today = new Date();
  const in7 = new Date(today); in7.setDate(in7.getDate() + 7);
  const upcoming = allEvents.filter(e => e.date >= today && e.date <= in7).length;

  const urgents = allEvents.filter(e => e.date.getMonth() === month && e.prio === 'urgent').length;
  const prios   = allEvents.filter(e => e.date.getMonth() === month && e.prio === 'prioritaire').length;

  document.getElementById('stat-total').textContent   = monthBriefs || '0';
  document.getElementById('stat-urgent').textContent  = urgents || '0';
  document.getElementById('stat-prio').textContent    = prios || '0';
  document.getElementById('stat-upcoming').textContent = upcoming || '0';
}

/* ── Détail ── */
function openDetail(ev) {
  const data = ev.brief.data || ev.brief;
  document.getElementById('d-title').textContent = ev.label;
  document.getElementById('d-sub').textContent = `${ev.kindLabel} · ${ev.date.toLocaleDateString('fr-BE', {day:'numeric',month:'long',year:'numeric'})}`;

  const badgeCls = ev.prio === 'urgent' ? 'badge-urgent' : ev.prio === 'prioritaire' ? 'badge-prioritaire' : 'badge-normal';
  const badgeLabel = ev.prio === 'urgent' ? 'Urgent' : ev.prio === 'prioritaire' ? 'Prioritaire' : 'Normal';

  const rows = [
    { icon:'ti-building', label:'Marque', val: ev.marque || '—' },
    { icon:'ti-tag',      label:'Type',   val: ev.type || '—' },
    { icon:'ti-alert-triangle', label:'Priorité', val: `<span class="badge ${badgeCls}">${badgeLabel}</span>` },
    { icon:'ti-calendar-event', label:'Date de lancement',       val: fmtDate(data.dateLancement) },
    { icon:'ti-calendar-check', label:'Infos validées avant le', val: fmtDate(data.dateValidation) },
    { icon:'ti-eye',            label:'Aperçu visuel souhaité',  val: fmtDate(data.dateRetourSimul) },
    { icon:'ti-user',           label:'Demandeur', val: data.ref || '—' },
    { icon:'ti-layout-columns', label:'Département', val: data.dept || '—' },
  ].filter(r => r.val && r.val !== '—' && r.val !== fmtDate(undefined));

  document.getElementById('detail-body').innerHTML = rows.map(r => `
    <div class="detail-row">
      <div class="detail-icon"><i class="ti ${r.icon}"></i></div>
      <div class="detail-info">
        <div class="detail-label">${r.label}</div>
        <div class="detail-val">${r.val}</div>
      </div>
    </div>`).join('');

  document.getElementById('detail-overlay').classList.add('open');
}

function fmtDate(d) {
  if (!d) return null;
  const dt = new Date(d);
  if (isNaN(dt)) return null;
  return dt.toLocaleDateString('fr-BE', {day:'numeric',month:'long',year:'numeric'});
}

function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('open');
}

/* ── Init ── */
(async () => {
  const briefs = await loadBriefs();
  allEvents = briefs.flatMap(briefToEvents);

  const today = new Date();
  renderCalendar(today.getFullYear(), today.getMonth());

  document.getElementById('btn-prev').addEventListener('click', () => {
    let m = currentMonth - 1, y = currentYear;
    if (m < 0) { m = 11; y--; }
    renderCalendar(y, m);
  });
  document.getElementById('btn-next').addEventListener('click', () => {
    let m = currentMonth + 1, y = currentYear;
    if (m > 11) { m = 0; y++; }
    renderCalendar(y, m);
  });
  document.getElementById('btn-today').addEventListener('click', () => {
    const t = new Date();
    renderCalendar(t.getFullYear(), t.getMonth());
  });
  document.getElementById('detail-close').addEventListener('click', closeDetail);
  document.getElementById('detail-overlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeDetail();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeDetail();
  });
})();
</script>
</body>
