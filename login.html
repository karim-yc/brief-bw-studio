<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BW Brief Studio — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0a0a;
    --surface:#141414;
    --border:#2a2a2a;
    --accent:#DFFF00;
    --text:#f0f0f0;
    --text-sec:#888;
    --radius:12px;
    --err:#ff4d4d;
  }
  body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .login-wrap{
    width:100%;
    max-width:400px;
    display:flex;
    flex-direction:column;
    gap:32px;
  }

  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    text-align:center;
  }
  .brand-logo{
    width:52px;height:52px;
    background:var(--accent);
    border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:20px;color:#000;letter-spacing:-0.5px;
  }
  .brand h1{
    font-size:22px;font-weight:700;color:var(--text);letter-spacing:-0.4px;
  }
  .brand p{
    font-size:13px;color:var(--text-sec);
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:28px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .field label{
    font-size:12.5px;font-weight:500;color:#ccc;
  }
  .field input{
    background:#1e1e1e;
    border:1.5px solid var(--border);
    border-radius:8px;
    padding:11px 14px;
    font-size:14px;font-family:inherit;
    color:var(--text);
    outline:none;
    transition:border-color .15s;
    width:100%;
  }
  .field input:focus{border-color:var(--accent);}
  .field input::placeholder{color:#555;}

  .btn-submit{
    background:var(--accent);
    color:#000;
    border:none;
    border-radius:8px;
    padding:12px 20px;
    font-size:14px;font-weight:600;font-family:inherit;
    cursor:pointer;
    width:100%;
    transition:opacity .15s;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-submit:hover{opacity:.88;}
  .btn-submit:disabled{opacity:.4;cursor:not-allowed;}

  .error-msg{
    background:#2a0a0a;
    border:1px solid #5a1a1a;
    border-radius:8px;
    padding:10px 14px;
    font-size:13px;color:var(--err);
    display:none;
  }
  .error-msg.show{display:block;}

  .footer-note{
    text-align:center;
    font-size:12px;color:var(--text-sec);
  }

  .spinner{
    width:16px;height:16px;
    border:2px solid rgba(0,0,0,.3);
    border-top-color:#000;
    border-radius:50%;
    animation:spin .6s linear infinite;
    display:none;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="brand">
    <div class="brand-logo">BW</div>
    <h1>Brief Studio</h1>
    <p>Accès réservé à l'équipe BW</p>
  </div>

  <div class="card">
    <div class="field">
      <label for="email">Adresse email</label>
      <input type="email" id="email" placeholder="vous@bnwburger.com" autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="error-msg" id="error-msg"></div>
    <button class="btn-submit" id="btn-login" onclick="doLogin()">
      <div class="spinner" id="spinner"></div>
      <span id="btn-label">Se connecter</span>
    </button>
    <div style="text-align:center;margin-top:4px">
      <button onclick="toggleForgot()" style="background:none;border:none;color:#888;font-size:12px;font-family:inherit;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:2px">
        Mot de passe oublié ?
      </button>
    </div>
  </div>

  <!-- Forgot password section (hidden by default) -->
  <div class="card" id="forgot-card" style="display:none">
    <div style="font-size:14px;font-weight:600;color:#ccc;margin-bottom:-8px">Réinitialiser le mot de passe</div>
    <div class="field">
      <label for="forgot-email">Adresse email</label>
      <input type="email" id="forgot-email" placeholder="vous@bnwburger.com" autocomplete="email"
        onkeydown="if(event.key==='Enter')doForgot()">
    </div>
    <div class="error-msg" id="forgot-error"></div>
    <div id="forgot-success" style="display:none;background:#0a2a0a;border:1px solid #1a5a1a;border-radius:8px;padding:10px 14px;font-size:13px;color:#4caf50"></div>
    <button class="btn-submit" id="btn-forgot" onclick="doForgot()">
      <div class="spinner" id="forgot-spinner"></div>
      <span id="forgot-label">Envoyer le lien</span>
    </button>
    <div style="text-align:center;margin-top:-8px">
      <button onclick="toggleForgot()" style="background:none;border:none;color:#888;font-size:12px;font-family:inherit;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:2px">
        ← Retour à la connexion
      </button>
    </div>
  </div>

  <!-- Set password (invite / recovery flow) -->
  <div class="card" id="set-password-card" style="display:none;flex-direction:column;gap:20px">
    <div id="set-password-title" style="font-size:14px;font-weight:600;color:#ccc">Choisir un mot de passe</div>
    <div class="field">
      <label for="new-password">Nouveau mot de passe</label>
      <input type="password" id="new-password" placeholder="8 caractères minimum"
        onkeydown="if(event.key==='Enter')doSetPassword()">
    </div>
    <div class="field">
      <label for="new-password2">Confirmer le mot de passe</label>
      <input type="password" id="new-password2" placeholder="••••••••"
        onkeydown="if(event.key==='Enter')doSetPassword()">
    </div>
    <div class="error-msg" id="set-pw-error"></div>
    <button class="btn-submit" id="btn-set-pw" onclick="doSetPassword()">
      <div class="spinner" id="set-pw-spinner"></div>
      <span id="set-pw-label">Confirmer</span>
    </button>
  </div>

  <p class="footer-note">Pas encore de compte ? Contactez l'équipe studio.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.6/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = 'https://zpapoywzilwubjglhsmu.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_PhHq5kbGxyntZ8JlSumImA_pqzR8tKL';
  const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const _nextPage = new URLSearchParams(location.search).get('next') || 'dashboard.html';

  // Detect invite / recovery token in hash fragment
  (async () => {
    const hash = new URLSearchParams(window.location.hash.slice(1));
    const type = hash.get('type');
    if (type === 'invite' || type === 'recovery') {
      // Supabase has already established the session from the hash
      const { data: { session } } = await sbClient.auth.getSession();
      if (session) {
        // Hide login/forgot cards, show set-password card
        document.querySelector('.card').style.display = 'none';
        document.getElementById('forgot-card').style.display = 'none';
        const spCard = document.getElementById('set-password-card');
        spCard.style.display = 'flex';
        if (type === 'invite') {
          document.getElementById('set-password-title').textContent = 'Bienvenue ! Choisissez votre mot de passe';
        }
        document.getElementById('new-password').focus();
        // Clear hash without reload
        history.replaceState(null, '', location.pathname + location.search);
      }
      return;
    }
    const { data: { session } } = await sbClient.auth.getSession();
    if (session) window.location.href = _nextPage;
  })();

  const emailEl    = document.getElementById('email');
  const passEl     = document.getElementById('password');
  const btnLogin   = document.getElementById('btn-login');
  const errorMsg   = document.getElementById('error-msg');
  const spinner    = document.getElementById('spinner');
  const btnLabel   = document.getElementById('btn-label');

  passEl.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  emailEl.addEventListener('keydown', e => { if (e.key === 'Enter') passEl.focus(); });

  function toggleForgot() {
    const card = document.getElementById('forgot-card');
    const loginCard = card.previousElementSibling;
    const showing = card.style.display !== 'none';
    card.style.display = showing ? 'none' : 'flex';
    loginCard.style.display = showing ? 'flex' : 'none';
    if (!showing) document.getElementById('forgot-email').focus();
  }

  async function doForgot() {
    const email = document.getElementById('forgot-email').value.trim();
    const errEl = document.getElementById('forgot-error');
    const sucEl = document.getElementById('forgot-success');
    if (!email) { errEl.textContent = 'Saisis ton adresse email.'; errEl.classList.add('show'); return; }
    errEl.classList.remove('show');
    sucEl.style.display = 'none';
    const btn = document.getElementById('btn-forgot');
    const sp  = document.getElementById('forgot-spinner');
    const lbl = document.getElementById('forgot-label');
    btn.disabled = true; sp.style.display = 'block'; lbl.textContent = 'Envoi…';
    const { error } = await sbClient.auth.resetPasswordForEmail(email, {
      redirectTo: 'https://karim-yc.github.io/brief-bw-studio/dashboard.html'
    });
    btn.disabled = false; sp.style.display = 'none'; lbl.textContent = 'Envoyer le lien';
    if (error) { errEl.textContent = error.message; errEl.classList.add('show'); return; }
    sucEl.style.display = 'block';
    sucEl.textContent = '✓ Email envoyé ! Vérifie ta boîte mail et clique sur le lien pour définir ton mot de passe.';
  }

  async function doLogin() {
    const email    = emailEl.value.trim();
    const password = passEl.value;
    if (!email || !password) { showError('Remplis tous les champs.'); return; }

    setLoading(true);
    hideError();

    const { error } = await sbClient.auth.signInWithPassword({ email, password });
    if (error) {
      setLoading(false);
      showError(friendlyError(error.message));
      return;
    }
    window.location.href = _nextPage;
  }

  function setLoading(on) {
    btnLogin.disabled = on;
    spinner.style.display   = on ? 'block' : 'none';
    btnLabel.textContent = on ? 'Connexion…' : 'Se connecter';
  }
  function showError(msg) { errorMsg.textContent = msg; errorMsg.classList.add('show'); }
  function hideError()    { errorMsg.classList.remove('show'); }

  function friendlyError(msg) {
    if (/invalid login/i.test(msg))   return 'Email ou mot de passe incorrect.';
    if (/email not confirmed/i.test(msg)) return 'Confirme d\'abord ton adresse email (vérifie ta boite mail).';
    if (/too many/i.test(msg))        return 'Trop de tentatives. Réessaie dans quelques minutes.';
    return msg;
  }

  async function doSetPassword() {
    const pw1 = document.getElementById('new-password').value;
    const pw2 = document.getElementById('new-password2').value;
    const errEl = document.getElementById('set-pw-error');
    errEl.classList.remove('show');
    if (pw1.length < 8) { errEl.textContent = 'Le mot de passe doit faire au moins 8 caractères.'; errEl.classList.add('show'); return; }
    if (pw1 !== pw2) { errEl.textContent = 'Les mots de passe ne correspondent pas.'; errEl.classList.add('show'); return; }
    const btn = document.getElementById('btn-set-pw');
    const sp  = document.getElementById('set-pw-spinner');
    const lbl = document.getElementById('set-pw-label');
    btn.disabled = true; sp.style.display = 'block'; lbl.textContent = 'Enregistrement…';
    const { error } = await sbClient.auth.updateUser({ password: pw1 });
    if (error) {
      btn.disabled = false; sp.style.display = 'none'; lbl.textContent = 'Confirmer';
      errEl.textContent = error.message; errEl.classList.add('show');
      return;
    }
    window.location.href = _nextPage;
  }
</script>
</body>
</html>
