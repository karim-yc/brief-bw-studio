name: Sync WhatsApp Business messages

on:
  schedule:
    - cron: '*/15 * * * *'   # toutes les 15 minutes
  workflow_dispatch:           # déclenchement manuel

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch WhatsApp messages
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, urllib.error
          from datetime import datetime, timezone

          token    = os.environ.get('WHATSAPP_TOKEN', '')
          phone_id = os.environ.get('WHATSAPP_PHONE_ID', '')

          if not token or not phone_id:
              print('⚠ WHATSAPP_TOKEN ou WHATSAPP_PHONE_ID non défini — skip')
              exit(0)

          # Récupérer les messages reçus via l'API Meta Cloud
          # Note : l'API WhatsApp Cloud ne permet pas de lister les messages entrants
          # directement — les messages sont push via webhook. Cette action gère
          # les messages mis en file d'attente dans un webhook Make/Cloudflare
          # et stockés dans le data store. Pour l'instant, on vérifie juste la
          # connectivité et on retourne un état "connecté".

          url = f'https://graph.facebook.com/v18.0/{phone_id}'
          req = urllib.request.Request(
              url,
              headers={'Authorization': f'Bearer {token}'}
          )

          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data = json.loads(resp.read())
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f'❌ Erreur API Meta: {e.code} — {body}')
              exit(1)
          except urllib.error.URLError as e:
              print(f'❌ Erreur réseau: {e}')
              exit(1)

          phone_number = data.get('display_phone_number', phone_id)
          verified     = data.get('verified_name', '')
          print(f'✅ WhatsApp connecté : {verified} ({phone_number})')

          # Lire les messages existants (accumulés par le webhook Make/CF Worker)
          try:
              with open('api/whatsapp-messages.json', 'r', encoding='utf-8') as f:
                  existing = json.load(f)
          except Exception:
              existing = {'ok': True, 'count': 0, 'messages': []}

          # Mettre à jour les métadonnées de connexion
          existing['ok']        = True
          existing['source']    = 'whatsapp-cloud-api'
          existing['updatedAt'] = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          existing['phone']     = phone_number
          existing['name']      = verified

          with open('api/whatsapp-messages.json', 'w', encoding='utf-8') as f:
              json.dump(existing, f, ensure_ascii=False, indent=2)

          print(f'📱 whatsapp-messages.json mis à jour — {existing.get("count", 0)} messages')
          PYEOF
        env:
          WHATSAPP_TOKEN:    ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}

      - name: Commit and push
        run: |
          git config user.email "bw-brief-bot@github.com"
          git config user.name "BW Brief Bot"
          git add api/whatsapp-messages.json
          if git diff --cached --quiet; then
            echo "Pas de changement"
          else
            git commit -m "auto: sync whatsapp status [skip ci]"
            git push
          fi
